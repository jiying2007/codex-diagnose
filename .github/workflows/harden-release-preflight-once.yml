name: Harden Diagnose release preflight once

on:
  push:
    branches: [governance-v1.0.1]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Add immutable governance-marker preflight and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          s = p.read_text()
          before_expr = '$' + '{{ github.event.before }}'
          token_expr = '$' + '{{ github.token }}'
          old_env = '        env:\n          GITHUB_EVENT_BEFORE: ' + before_expr + '\n'
          new_env = (
              '        env:\n'
              '          GITHUB_EVENT_BEFORE: ' + before_expr + '\n'
              '          GH_TOKEN: ' + token_expr + '\n'
              '          IMMUTABILITY_MARKER_TAG: governance-release-immutability-v1\n'
          )
          if old_env not in s:
              raise SystemExit('expected release env block not found')
          s = s.replace(old_env, new_env, 1)
          old_gate = '''          publish=true\n          if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then\n            publish=false\n          fi\n'''
          new_gate = '''          publish=true\n          if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then\n            publish=false\n          else\n            marker_immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${IMMUTABILITY_MARKER_TAG}" --jq '.immutable' 2>/dev/null || true)\n            test "$marker_immutable" = true || {\n              echo "Immutable-release governance marker ${IMMUTABILITY_MARKER_TAG} is missing or not immutable; refusing to create ${tag}." >&2\n              exit 1\n            }\n          fi\n'''
          if old_gate not in s:
              raise SystemExit('expected publish gate not found')
          s = s.replace(old_gate, new_gate, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/harden-release-preflight-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          git commit -m 'chore(release): require immutable governance marker before tag'
          git push origin HEAD:governance-v1.0.1
