name: Prepare governance v1.0.1 once

on:
  push:
    branches: [governance-v1.0.1]
    paths:
      - .github/workflows/prepare-governance-v1.0.1-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Bump governance-only release identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const contract = JSON.parse(fs.readFileSync('product-contract.json','utf8'));
          if (pkg.version !== '1.0.0' || lock.version !== '1.0.0' || lock.packages[''].version !== '1.0.0' || contract.diagnoseVersion !== '1.0.0') throw new Error('unexpected baseline');
          pkg.version = '1.0.1';
          lock.version = '1.0.1';
          lock.packages[''].version = '1.0.1';
          contract.diagnoseVersion = '1.0.1';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          fs.writeFileSync('product-contract.json', JSON.stringify(contract, null, 2) + '\n');
          for (const file of ['README.md','README.zh-CN.md']) {
            let s = fs.readFileSync(file,'utf8');
            s = s.replace(/v1\.0\.0/g, 'v1.0.1').replace(/\*\*1\.0\.0\*\*/g, '**1.0.1**');
            fs.writeFileSync(file, s);
          }
          NODE
          rm .github/workflows/prepare-governance-v1.0.1-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json product-contract.json README.md README.zh-CN.md .github/workflows/prepare-governance-v1.0.1-once.yml
          git diff --cached --check
          git commit -m 'chore(release): prepare Diagnose v1.0.1 governance patch'
          git push origin HEAD:governance-v1.0.1
