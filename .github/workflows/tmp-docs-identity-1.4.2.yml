name: Temporary Diagnose identity docs
on:
  push:
    branches: [fix/docs-identity-1.4.2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: {node-version: '22.22.2'}
      - name: Align current Diagnose identity docs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const version='1.4.2';
          const writeJson=(file,fn)=>{const x=JSON.parse(fs.readFileSync(file,'utf8'));fn(x);fs.writeFileSync(file,JSON.stringify(x,null,2)+'\n');};
          writeJson('package.json',x=>x.version=version);
          writeJson('package-lock.json',x=>{x.version=version;if(x.packages?.[''])x.packages[''].version=version;});
          writeJson('product-contract.json',x=>{x.diagnoseVersion=version;x.productVersion=version;});
          const docs=['README.md','README.zh-CN.md','ARCHITECTURE.md','SECURITY.md','VERIFY_RELEASE.md'].filter(fs.existsSync);
          for(const file of docs){let s=fs.readFileSync(file,'utf8');s=s.replace(/v1\.4\.0/g,'v1.4.2').replace(/Diagnose: \*\*1\.4\.0\*\*/g,'Diagnose: **1.4.2**').replace(/Diagnose：\*\*1\.4\.0\*\*/g,'Diagnose：**1.4.2**').replace(/\/ v4\.13\.0/g,'/ v4.13.1').replace(/Safe Core 4\.13\.0/g,'Safe Core 4.13.1').replace(/Core 4\.13\.0/g,'Core 4.13.1');fs.writeFileSync(file,s);}
          NODE
          grep -nRE 'v1\.4\.0|Diagnose(:|：) \*\*1\.4\.0|v4\.13\.0|Safe Core 4\.13\.0|Core 4\.13\.0' README.md README.zh-CN.md ARCHITECTURE.md SECURITY.md VERIFY_RELEASE.md 2>/dev/null && exit 2 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json product-contract.json README.md README.zh-CN.md ARCHITECTURE.md SECURITY.md VERIFY_RELEASE.md
          git diff --cached --check
          git commit -m 'docs(identity): align Diagnose 1.4.2 current state'
          git push origin HEAD:fix/docs-identity-1.4.2
