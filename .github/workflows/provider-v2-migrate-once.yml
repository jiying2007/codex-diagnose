name: Provider V2 Migrate Once

on:
  push:
    branches: [family/provider-contract-v2]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: family/provider-contract-v2
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply product migration
        env:
          CORE_SHA: 7878dae982088746c06e4fe747b2468e6af274a2
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const readJson=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const writeJson=(f,v)=>fs.writeFileSync(f,JSON.stringify(v,null,2)+'\n');
          const replaceOnce=(t,a,b,f)=>{if(!t.includes(a))throw new Error(`${f}: migration anchor missing: ${a}`);return t.replace(a,b);};
          const pkg=readJson('package.json');pkg.version='1.3.0';writeJson('package.json',pkg);
          const contract=readJson('product-contract.json');contract.diagnoseVersion='1.3.0';contract.productVersion='1.3.0';contract.safeCoreVersion='4.12.0';contract.safeCoreCommit=process.env.CORE_SHA;contract.codexRuntimeVersion=2;contract.providerContractVersion=2;writeJson('product-contract.json',contract);
          let args=fs.readFileSync('src/args.js','utf8');
          args=replaceOnce(args,"const PROVIDERS=new Set(['openai','openai-compatible']);","const PROVIDERS=new Set(['openai','openai-compatible']);\nconst CREDENTIAL_SOURCES=new Set(['auto','env','auth-json']);",'src/args.js');
          args=replaceOnce(args,'Codex Diagnose Safe 1.0.0','Codex Diagnose Safe 1.3.0','src/args.js');
          args=replaceOnce(args,"  --provider-api-key-env ENV   Credential env reference only\\n","  --provider-api-key-env ENV   Credential env reference only\\n  --provider-credential-source auto|env|auth-json\\n  --provider-allow-insecure-http  Explicitly allow trusted non-loopback HTTP relay\\n",'src/args.js');
          args=replaceOnce(args,"providerMode:'openai',providerBaseUrl:'',providerApiKeyEnv:'OPENAI_API_KEY',artifacts:[]","providerMode:'openai',providerBaseUrl:'',providerApiKeyEnv:'OPENAI_API_KEY',providerCredentialSource:'auto',providerAllowInsecureHttp:false,artifacts:[]",'src/args.js');
          args=replaceOnce(args,"    else if(a==='--provider-api-key-env'){out.providerApiKeyEnv=envName(take(i,a),a);i++;}","    else if(a==='--provider-api-key-env'){out.providerApiKeyEnv=envName(take(i,a),a);i++;}\n    else if(a==='--provider-credential-source'){out.providerCredentialSource=cleanString(take(i,a),a,32);if(!CREDENTIAL_SOURCES.has(out.providerCredentialSource))throw error('--provider-credential-source is unsupported');i++;}\n    else if(a==='--provider-allow-insecure-http')out.providerAllowInsecureHttp=true;",'src/args.js');
          args=replaceOnce(args,"  else if(out.providerBaseUrl)throw error('--provider-base-url is only valid for openai-compatible');","  else {if(out.providerBaseUrl)throw error('--provider-base-url is only valid for openai-compatible');if(out.providerCredentialSource!=='auto'||out.providerAllowInsecureHttp)throw error('--provider-credential-source/--provider-allow-insecure-http require openai-compatible');}",'src/args.js');
          fs.writeFileSync('src/args.js',args);
          let codex=fs.readFileSync('src/codex.js','utf8');
          codex=replaceOnce(codex,"{provider:{mode:'openai-compatible',baseUrl:options.providerBaseUrl,apiKeyEnv:options.providerApiKeyEnv},timeouts:","{provider:{mode:'openai-compatible',baseUrl:options.providerBaseUrl,apiKeyEnv:options.providerApiKeyEnv,credentialSource:options.providerCredentialSource||'auto',allowInsecureHttp:Boolean(options.providerAllowInsecureHttp)},timeouts:",'src/codex.js');
          fs.writeFileSync('src/codex.js',codex);
          fs.writeFileSync('test/provider-contract-v2.test.js',`'use strict';\nconst test=require('node:test');\nconst assert=require('node:assert/strict');\nconst {parseArgs}=require('../src/args');\nconst {runtimeFromOptions}=require('../src/codex');\ntest('relay CLI exposes Core Provider Contract v2 controls',()=>{const v=parseArgs(['--log','build.log','--provider-mode','openai-compatible','--provider-base-url','http://192.168.2.109:3000/v1','--provider-credential-source','auth-json','--provider-allow-insecure-http']);assert.equal(v.providerCredentialSource,'auth-json');assert.equal(v.providerAllowInsecureHttp,true);const runtime=runtimeFromOptions(v);assert.equal(runtime.provider.credentialSource,'auth-json');assert.equal(runtime.provider.allowInsecureHttp,true);assert.equal(runtime.provider.baseUrl,'http://192.168.2.109:3000/v1');});\ntest('provider-v2 controls cannot be attached to built-in OpenAI mode',()=>{assert.throws(()=>parseArgs(['--log','build.log','--provider-credential-source','auth-json']),/require openai-compatible/);assert.throws(()=>parseArgs(['--log','build.log','--provider-allow-insecure-http']),/require openai-compatible/);});\n`);
          const noteEn=`\n## Relay credentials and private-network HTTP\n\nCodex Diagnose Safe 1.3.0 consumes Core Runtime/Provider Contract v2. Use \`--provider-credential-source auto|env|auth-json\`; \`auto\` prefers the configured provider environment variable and otherwise reads \`\${CODEX_HOME}/auth.json\` or \`~/.codex/auth.json\` through Core. The auth file must use \`auth_mode=apikey\` with \`OPENAI_API_KEY\`. Non-loopback \`http://\` relays require the explicit \`--provider-allow-insecure-http\` switch.\n`;
          const noteZh=`\n## 中转站凭据与局域网 HTTP\n\nCodex Diagnose Safe 1.3.0 统一消费 Core Runtime/Provider Contract v2。使用 \`--provider-credential-source auto|env|auth-json\`；\`auto\` 会优先读取配置的 Provider 环境变量，否则由 Core 读取 \`\${CODEX_HOME}/auth.json\` 或 \`~/.codex/auth.json\`。auth 文件必须是 \`auth_mode=apikey\` 且包含 \`OPENAI_API_KEY\`。非 loopback 的 \`http://\` 中转地址必须显式加 \`--provider-allow-insecure-http\`。\n`;
          for(const [f,n] of [['README.md',noteEn],['README.zh-CN.md',noteZh]]){let t=fs.readFileSync(f,'utf8');if(!t.includes('--provider-credential-source'))t+=n;fs.writeFileSync(f,t);}
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');if(!changelog.includes('## 1.3.0 - 2026-09-01'))changelog=changelog.replace(/^# Changelog\n/,`# Changelog\n\n## 1.3.0 - 2026-09-01\n\n### Provider Contract v2\n\n- Pin Codex Safe Core 4.12.0.\n- Add auto/env/auth-json relay credential selection and direct Codex auth.json API-key reuse.\n- Add explicit trusted private-network HTTP opt-in while preserving HTTPS by default.\n`);fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          git -C src/codex-safe-core fetch origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --detach "$CORE_SHA"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm .github/workflows/provider-v2-migrate-once.yml
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(diagnose): support auth.json relay credentials"
          git push origin HEAD:family/provider-contract-v2
