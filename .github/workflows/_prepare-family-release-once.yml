name: Prepare Diagnose 1.1.2 Once
on:
  push:
    branches: [release/family-core-4.10.1]
    paths: [.github/workflows/_prepare-family-release-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/family-core-4.10.1
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '22.22.2' }
      - name: Prepare immutable Family release identity
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.1.2 --no-git-tag-version --ignore-scripts
          node <<'NODE'
          const fs=require('fs');
          const p=require('./product-contract.json');
          p.diagnoseVersion='1.1.2'; p.productVersion='1.1.2';
          fs.writeFileSync('product-contract.json',JSON.stringify(p,null,2)+'\n');
          NODE
          git add package.json package-lock.json product-contract.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(release): Diagnose 1.1.2 on Core 4.10.1'
          git push origin HEAD:release/family-core-4.10.1
