name: Repin Diagnose Core 4.10.2 Once
on:
  push:
    branches: [chore/core-4.10.2]
    paths: [.github/workflows/_repin-core-once.yml]
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: chore/core-4.10.2, submodules: recursive }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '22.22.2' }
      - shell: bash
        run: |
          set -euo pipefail
          core=cd9788f1280a217fbe6d0beb59682a85a8b82c4d
          npm version 1.1.4 --no-git-tag-version --ignore-scripts
          git -C src/codex-safe-core fetch origin "$core"
          git -C src/codex-safe-core checkout "$core"
          node <<'NODE'
          const fs=require('fs');const c=require('./product-contract.json');c.diagnoseVersion='1.1.4';c.productVersion='1.1.4';c.safeCoreVersion='4.10.2';c.safeCoreCommit='cd9788f1280a217fbe6d0beb59682a85a8b82c4d';fs.writeFileSync('product-contract.json',JSON.stringify(c,null,2)+'\n');
          for(const f of ['README.md','README.zh-CN.md','ARCHITECTURE.md','SECURITY.md']){if(fs.existsSync(f)){let t=fs.readFileSync(f,'utf8');t=t.replaceAll('1.1.3','1.1.4').replaceAll('76418b80533c644e3ab01045290cd3cdd355622c','cd9788f1280a217fbe6d0beb59682a85a8b82c4d').replaceAll('4.10.1','4.10.2');fs.writeFileSync(f,t);}}
          NODE
          git add package.json package-lock.json product-contract.json README.md README.zh-CN.md ARCHITECTURE.md SECURITY.md src/codex-safe-core
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(family): repin Diagnose to Core 4.10.2'
          git push origin HEAD:chore/core-4.10.2
