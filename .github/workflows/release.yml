name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: diagnose-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          cache: npm
      - id: version
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          IMMUTABILITY_MARKER_TAG: governance-release-immutability-v1
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          contract=$(node -p "require('./product-contract.json').diagnoseVersion")
          test "$version" = "$contract"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"
          publish=true
          if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then
            publish=false
          else
            marker_immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${IMMUTABILITY_MARKER_TAG}" --jq '.immutable' 2>/dev/null || true)
            test "$marker_immutable" = true || {
              echo "Immutable-release governance marker ${IMMUTABILITY_MARKER_TAG} is missing or not immutable; refusing to create ${tag}." >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.version.outputs.publish == 'true'
        run: npm run ci

  cross-platform:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.2','24.19.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci

  publish:
    needs: [validate, cross-platform]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build reproducible package evidence
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          tgz="codex-diagnose-safe-${version}.tgz"
          produced=$(npm pack --ignore-scripts --json | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")
          test "$produced" = "$tgz"
          tar -tzf "$tgz" > /tmp/package-files.txt
          grep -Fx 'package/src/cli.js' /tmp/package-files.txt
          grep -Fx 'package/src/codex-safe-core/diagnosis-platform.js' /tmp/package-files.txt
          if grep -E '^package/(test|scripts|\.github|\.gitmodules|src/codex-safe-core/(test|\.github|package\.json))' /tmp/package-files.txt; then
            echo 'package contains development-only files' >&2; exit 1
          fi
          npm sbom --sbom-format spdx > SBOM.spdx.json
          test -s SBOM.spdx.json
          sha256sum "$tgz" SBOM.spdx.json > SHA256SUMS
      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            codex-diagnose-safe-${{ needs.validate.outputs.version }}.tgz
            SBOM.spdx.json
            SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-diagnose-safe-${{ needs.validate.outputs.version }}
          path: |
            codex-diagnose-safe-${{ needs.validate.outputs.version }}.tgz
            SBOM.spdx.json
            SHA256SUMS
          if-no-files-found: error
      - name: Create exact release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "tag already exists unexpectedly" >&2; exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA" >/dev/null
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          tgz="codex-diagnose-safe-${version}.tgz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets will not be overwritten." >&2; exit 1
          fi
          gh release create "$RELEASE_TAG" "$tgz" SBOM.spdx.json SHA256SUMS --title "Codex Diagnose Safe ${version}" --generate-notes --verify-tag
          immutable=false
          for attempt in {1..12}; do
            immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.immutable')
            [[ "$immutable" == true ]] && break
            sleep 5
          done
          test "$immutable" = true
          gh release verify "$RELEASE_TAG"
          gh release verify-asset "$RELEASE_TAG" "$tgz"
          gh release verify-asset "$RELEASE_TAG" SBOM.spdx.json
          gh release verify-asset "$RELEASE_TAG" SHA256SUMS
