name: Sync Diagnose repin docs once
on:
  push:
    branches: [repin-core-v4.9.1]
permissions:
  contents: write
concurrency:
  group: sync-diagnose-repin-docs-once
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repin-core-v4.9.1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Align bilingual product identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const old='10393a0035ce5168b3d0e88822af0d74fe85ec6c';
          const next='f4544a302c5053cf0a41e30944933554825e8ecc';
          for(const file of ['README.md','README.zh-CN.md']){
            let text=fs.readFileSync(file,'utf8').replaceAll(old,next).replaceAll('v4.8.1','v4.9.1');
            if(file==='README.md'&&!text.includes('post-failure root-cause')) text=text.replace('It is not a CI runner, retry bot, code fixer, PR/MR description generator, or replacement for GitLab pipelines.','It is the Family post-failure root-cause product: Review Safe and Review Service find risks in code changes; Diagnose explains CI/build/test failures after they occur. It is not a CI runner, retry bot, code fixer, PR/MR description generator, or replacement for GitLab pipelines.');
            if(file==='README.zh-CN.md'&&!text.includes('失败后的根因')) text=text.replace(/(它不是[^\n]*PR\/MR[^\n]*。)/,'它是产品族中“失败后的根因诊断”产品：Review Safe / Review Service 负责代码变更风险，Diagnose 负责解释已经发生的 CI/build/test 失败。$1');
            fs.writeFileSync(file,text);
          }
          NODE
          git add README.md README.zh-CN.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(diagnose): align v4.9.1 trust root and product boundary'
          git push origin HEAD:repin-core-v4.9.1
