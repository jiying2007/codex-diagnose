name: Temporary Diagnose 1.5 Model Routing Finalizer Retry

on:
  push:
    branches: ["feat/model-routing-v1-runtime"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/model-routing-v1-runtime
          fetch-depth: 0
      - name: Execute corrected deterministic migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/_tmp-model-routing-150.yml').read_text()
          start=workflow.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=workflow.index("\n          PY\n",start)
          script=textwrap.dedent(workflow[start:end])
          marker="ch=Path('CHANGELOG.md')"
          if marker in script: script=script[:script.index(marker)]
          exec(compile(script,'diagnose-1.5-migration','exec'))
          PY
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add -A -- ':!.github/workflows/**'
          if ! git diff --cached --quiet; then git commit -m 'feat(diagnose): consume Model Routing Contract v1'; git push origin HEAD:feat/model-routing-v1-runtime; fi
