name: Prepare Diagnose 1.1.3 Once
on:
  push:
    branches: [release/family-docs-1.1.3]
    paths: [.github/workflows/_prepare-diagnose-1.1.3-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/family-docs-1.1.3
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '22.22.2' }
      - name: Align release identity and Family documentation
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.1.3 --no-git-tag-version --ignore-scripts
          node <<'NODE'
          const fs=require('fs');
          const contract=require('./product-contract.json');
          contract.diagnoseVersion='1.1.3';
          contract.productVersion='1.1.3';
          fs.writeFileSync('product-contract.json',JSON.stringify(contract,null,2)+'\n');
          const oldCore='43e818dc9ae91051f55374a9f9a47b9df6420cd6';
          const newCore='76418b80533c644e3ab01045290cd3cdd355622c';
          for (const file of ['README.md','README.zh-CN.md']) {
            let s=fs.readFileSync(file,'utf8');
            s=s.replaceAll('1.1.1','1.1.3').replaceAll('v1.1.1','v1.1.3');
            s=s.replaceAll(oldCore,newCore).replaceAll('v4.9.5','v4.10.1');
            if (file==='README.md') {
              s=s.replace(`Codex Safe Core\n├── Codex Review Safe\n├── Codex Commit Safe\n├── Codex Review Service\n└── Codex Diagnose Safe`, `Codex Safe Core\n├── Codex Review Safe\n├── Codex Commit Safe\n├── Codex Change Safe\n├── Codex Review Service\n└── Codex Diagnose Safe`);
              s=s.replace('Codex PR Safe remains retired. PR/MR creation and metadata belong to the SCM-native UI/CLI/API; no PR/MR narrative generator is added here.','Codex PR Safe remains retired as the former model-generated narrative identity. Codex Change Safe is the active deterministic PR/MR delivery product; Diagnose remains focused only on bounded failure diagnosis and does not generate PR/MR narratives.');
            } else {
              s=s.replace(`Codex Safe Core\n├── Codex Review Safe\n├── Codex Commit Safe\n├── Codex Review Service\n└── Codex Diagnose Safe`, `Codex Safe Core\n├── Codex Review Safe\n├── Codex Commit Safe\n├── Codex Change Safe\n├── Codex Review Service\n└── Codex Diagnose Safe`);
              s=s.replace('Codex PR Safe 继续保持退役。PR/MR 创建和元数据由 SCM 原生 UI/CLI/API 负责，本产品不增加 PR/MR Narrative Generator。','Codex PR Safe 作为旧的模型 PR/MR Narrative 身份继续保持退役。Codex Change Safe 是当前确定性的 PR/MR 交付产品；Diagnose 只负责受限失败诊断，不生成 PR/MR Narrative。');
            }
            fs.writeFileSync(file,s);
          }
          NODE
          git add package.json package-lock.json product-contract.json README.md README.zh-CN.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs(family): align Diagnose 1.1.3 with Change Safe'
          git push origin HEAD:release/family-docs-1.1.3
