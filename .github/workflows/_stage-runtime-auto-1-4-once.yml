name: Stage Diagnose Runtime Auto 1.4 Once
on:
  push:
    branches: [feat/runtime-auto-1.4.0]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '24.19.0' }
      - name: Align current docs and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          core='d95f67cc61ce66c16e2aa440829655919e906a75'
          p=Path('README.md'); s=p.read_text()
          s=re.sub(r'`product-contract\.json` is the machine-checked identity for v[^:]+:', '`product-contract.json` is the machine-checked identity for v1.4.0:', s)
          s=re.sub(r'- Diagnose: \*\*[^*]+\*\*', '- Diagnose: **1.4.0**', s)
          s=re.sub(r'- Safe Core: exact commit `[^`]+` / v[^\n]+', f'- Safe Core: exact commit `{core}` / v4.13.0', s)
          s=re.sub(r'- Diagnosis Receipt: \*\*v?\d+\*\*', '- Diagnosis Receipt: **v2**', s)
          s=re.sub(r'emits a machine-verifiable \*\*Diagnosis Receipt v\d+\*\*', 'emits a machine-verifiable **Diagnosis Receipt v2**', s)
          s=re.sub(r'## Relay credentials and private-network HTTP[\s\S]*$', '''## Runtime Contract v3 — zero-config relay\n\nCodex Diagnose Safe 1.4.0 defaults to **Auto** runtime discovery. If `codex` already works for the current OS account/container, Diagnose reuses machine Family Runtime (`~/.codex-safe/runtime.json`) or machine Codex configuration (`${CODEX_HOME}/config.toml` / `~/.codex/config.toml`) without requiring provider flags. Credentials remain in the configured environment variable or `${CODEX_HOME}/auth.json` / `~/.codex/auth.json`; secret values never enter argv.\n\nLiteral private-IP HTTP relays inherited from machine-owned Codex configuration are accepted with a plaintext warning by Core. Public/non-IP HTTP remains fail-closed unless a machine-scoped Family Runtime explicitly trusts it. `--provider-mode openai|openai-compatible` and related flags are advanced per-command overrides, not normal setup.\n''', s)
          s=s.replace('Diagnosis Receipt v1','Diagnosis Receipt v2')
          p.write_text(s)

          p=Path('README.zh-CN.md'); s=p.read_text()
          s=re.sub(r'`product-contract\.json`[^\n]*v[^：:]+[：:]', '`product-contract.json` 是 v1.4.0 的机器校验产品身份：', s, count=1)
          s=re.sub(r'- Diagnose：[ \t]*\*\*[^*]+\*\*', '- Diagnose：**1.4.0**', s)
          s=re.sub(r'- Safe Core：[^\n]*', f'- Safe Core：精确提交 `{core}` / v4.13.0', s)
          s=re.sub(r'- Diagnosis Receipt：[ \t]*\*\*v?\d+\*\*', '- Diagnosis Receipt：**v2**', s)
          s=s.replace('Diagnosis Receipt v1','Diagnosis Receipt v2')
          s=re.sub(r'## 中转站凭据与私网 HTTP[\s\S]*$', '''## Runtime Contract v3 — 零配置中转站\n\nCodex Diagnose Safe 1.4.0 默认使用 **Auto** Runtime。只要当前操作系统用户/容器中的 `codex` 已可正常调用，Diagnose 就直接复用机器级 Family Runtime（`~/.codex-safe/runtime.json`）或机器级 Codex 配置（`${CODEX_HOME}/config.toml` / `~/.codex/config.toml`），无需再填写 provider 参数。凭据仍来自配置的环境变量或 `${CODEX_HOME}/auth.json` / `~/.codex/auth.json`，Secret 不进入 argv。\n\n机器级 Codex 配置中的字面量私网 IP HTTP 中转站可由 Core 自动继承并明确提示明文风险；公网/非 IP HTTP 继续 fail-closed，除非机器级 Family Runtime 显式信任。`--provider-mode openai|openai-compatible` 及相关参数仅作为高级单次覆盖，不是正常安装步骤。\n''', s)
          if 'Runtime Contract v3' not in s:
              s += '''\n\n## Runtime Contract v3 — 零配置中转站\n\n默认 Auto Runtime 复用当前机器/容器的 `~/.codex/config.toml` 与 `auth.json`；私网 IP HTTP 可继承并提示明文风险，公网 HTTP 继续 fail-closed。\n'''
          p.write_text(s)
          PY
          npm run ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(runtime): align Diagnose 1.4.0 Runtime v3 contract'
            git push origin HEAD:feat/runtime-auto-1.4.0
          fi
