name: Fix Diagnose time v1.1.1 once
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix-diagnosis-time-v1.1.1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-diagnosis-time-v1.1.1
          persist-credentials: true
      - name: Bind human diagnosis output to exact UTC receipt
        env:
          OLD_SHA: 2011591e76cf73c0890b702a5bcd3499de91bbbc
          NEW_SHA: bc367cf3fbc57d7060bce343fcf4a6d5312f7ab8
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),old=process.env.OLD_SHA,neu=process.env.NEW_SHA;
          function replace(p,a,b){let s=fs.readFileSync(p,'utf8');if(!s.includes(a))throw new Error(`missing pattern ${p}`);fs.writeFileSync(p,s.replace(a,b));}
          replace('src/diagnose.js',"const receipt=createDiagnosisReceipt({evidence,diagnosis,model,codexVersion}),markdown=formatDiagnosisMarkdown(diagnosis,evidence);","const receipt=createDiagnosisReceipt({evidence,diagnosis,model,codexVersion}),markdown=formatDiagnosisMarkdown(diagnosis,evidence,receipt.createdAt);");
          replace('src/notify.js',
            "function compactText(diagnosis,evidence){const job=evidence?.subject?.jobName||`job ${evidence?.subject?.jobId||''}`;return [`Codex Diagnose Safe: ${diagnosis.classification}`,job,diagnosis.rootCause,`Confidence: ${Math.round(diagnosis.confidence*100)}%`,`Retry: ${diagnosis.retryRecommended?'yes':'no'}`].filter(Boolean).join('\\n').slice(0,3500);}",
            "function compactText(diagnosis,evidence,receipt={}){const job=evidence?.subject?.jobName||`job ${evidence?.subject?.jobId||''}`,time=typeof receipt?.createdAt==='string'?receipt.createdAt:'';return [`Codex Diagnose Safe: ${diagnosis.classification}`,time?`Diagnosis time (UTC): ${time}`:'',job,diagnosis.rootCause,`Confidence: ${Math.round(diagnosis.confidence*100)}%`,`Retry: ${diagnosis.retryRecommended?'yes':'no'}`].filter(Boolean).join('\\n').slice(0,3500);}");
          replace('src/notify.js',"async function notifyDiagnosis({provider,webhookEnv,diagnosis,evidence,env=process.env,timeoutMs=10000}={}){const url=resolveWebhook(provider,webhookEnv,env),text=compactText(diagnosis,evidence),body=", "async function notifyDiagnosis({provider,webhookEnv,diagnosis,evidence,receipt,env=process.env,timeoutMs=10000}={}){const url=resolveWebhook(provider,webhookEnv,env),text=compactText(diagnosis,evidence,receipt),body=");
          replace('src/cli.js',"if(options.notifyProvider)await notifyDiagnosis({provider:options.notifyProvider,webhookEnv:options.notifyWebhookEnv,diagnosis:result.diagnosis,evidence:result.evidence});","if(options.notifyProvider)await notifyDiagnosis({provider:options.notifyProvider,webhookEnv:options.notifyWebhookEnv,diagnosis:result.diagnosis,evidence:result.evidence,receipt:result.receipt});");
          replace('test/diagnose.test.js',"const{runDiagnosis}=require('../src/diagnose');","const{runDiagnosis}=require('../src/diagnose');const{compactText}=require('../src/notify');");
          replace('test/diagnose.test.js',"assert.match(result.evidence.subject.commitSha,/^local:/);","assert.match(result.evidence.subject.commitSha,/^local:/);assert.match(result.receipt.createdAt,/Z$/);assert.match(result.markdown,/Diagnosis time \\(UTC\\):/);assert.match(compactText(result.diagnosis,result.evidence,result.receipt),new RegExp(result.receipt.createdAt.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')));");
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version='1.1.1';fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const pc=JSON.parse(fs.readFileSync('product-contract.json','utf8'));pc.diagnoseVersion='1.1.1';pc.productVersion='1.1.1';pc.safeCoreVersion='4.9.4';pc.safeCoreCommit=neu;fs.writeFileSync('product-contract.json',JSON.stringify(pc,null,2)+'\n');
          for(const p of ['README.md','README.zh-CN.md']){let s=fs.readFileSync(p,'utf8').replaceAll(old,neu).replaceAll('Core v4.9.3','Core v4.9.4');fs.writeFileSync(p,s);}
          NODE
          git update-index --cacheinfo 160000,$NEW_SHA,src/codex-safe-core
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add src/diagnose.js src/notify.js src/cli.js test/diagnose.test.js package.json product-contract.json README.md README.zh-CN.md
          git add -u src/codex-safe-core
          git commit -m 'fix(diagnose): bind human output to UTC receipt in v1.1.1'
          git push origin HEAD:fix-diagnosis-time-v1.1.1
