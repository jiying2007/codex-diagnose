name: Finalize Diagnose Core v4.9.5 once
on:
  push:
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/repin-core-v4.9.5'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repin-core-v4.9.5
          persist-credentials: true
      - name: Fix current Diagnose identity wording
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          let en=fs.readFileSync('README.md','utf8');
          en=en.replace('`product-contract.json` is the machine-checked identity for v1.1.0:','`product-contract.json` is the machine-checked identity for v1.1.1:');
          fs.writeFileSync('README.md',en);
          let zh=fs.readFileSync('README.zh-CN.md','utf8');
          zh=zh.replace('`product-contract.json` 是 v1.1.0 当前产品身份的机器校验来源：','`product-contract.json` 是 v1.1.1 当前产品身份的机器校验来源：')
               .replace('- Diagnose：**1.1.0**','- Diagnose：**1.1.1**');
          fs.writeFileSync('README.zh-CN.md',zh);
          NODE
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add README.md README.zh-CN.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(diagnose): align current v1.1.1 identity'
            git push origin HEAD:repin-core-v4.9.5
          fi
